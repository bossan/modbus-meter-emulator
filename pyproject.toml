[project]
name = "modbus-meter-emulator"
version = "0.1.0"
description = "Emulates an energy meter with modbus communication"
readme = "README.md"
authors = [{ name = "Sander Bos", email = "mail@sanderbos.net" }]
requires-python = ">=3.9,<4.0"
dependencies = [
    "paho-mqtt>=2.1.0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pymodbus[serial]>=3.8.6,<3.10.0",
]

[project.urls]
Repository = "https://github.com/bossan/modbus-meter-emulator"

[project.scripts]
meter = "modbus_meter_emulator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
